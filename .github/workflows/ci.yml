# 日常 CI（迭代 27）：push / PR 触发——dotnet 全量构建测试 + 前端 lint / 双模式测试 / 双模式构建 + Android 构建（迭代 49）。
# 与 release.yml 的 test / android job 命令一致（不含打包 / 发布）；让主干回归在提交时即被发现，而不是发版时。
name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新推送取消未完成的旧运行（省配额；PR 场景尤其有效）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '26.12.1'
  PNPM_VERSION: '12.15.0'
  WIX_VERSION: '7.0.0'

jobs:
  check:
    name: 构建与测试（dotnet + 前端）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        run: dotnet restore LabelFrame.slnx
      - name: dotnet build
        run: dotnet build LabelFrame.slnx -c Release --no-restore
      - name: dotnet test（含覆盖率收集，排除 Perf/Soak——它们由 nightly-perf 跑）
        run: dotnet test LabelFrame.slnx -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~Perf&FullyQualifiedName!~Soak"
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/*/coverage.cobertura.xml'
          if-no-files-found: warn

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 前端 lint
        working-directory: web
        run: pnpm lint
      - name: 前端测试（client 模式）
        working-directory: web
        run: pnpm test
      - name: 前端测试（server 模式）
        working-directory: web
        env:
          VITE_UI_MODE: server
        run: pnpm test
      - name: 前端构建（client，含 tsc 类型检查）
        working-directory: web
        run: pnpm build
      - name: 前端构建（server）
        working-directory: web
        env:
          VITE_UI_MODE: server
        run: pnpm build:server

  web-linux:
    name: Linux 前端构建（E2E 镜像阶段）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证冻结安装与 Linux 原生构建工具
        run: docker build --target web-build -f packaging/e2e/Dockerfile.server -t labelframe-web-check .

  msi-verify:
    name: MSI 结构断言（安装包 UI 契约）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装 WiX 与扩展
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          $wix = Join-Path $HOME '.dotnet/tools/wix.exe'
          & $wix eula accept wix7 2>$null | Out-Null
          & $wix extension add -g WixToolset.NetFx.wixext/${{ env.WIX_VERSION }}
          if ($LASTEXITCODE -ne 0) { throw 'wix extension add (NetFx) 失败' }
          & $wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          if ($LASTEXITCODE -ne 0) { throw 'wix extension add (UI) 失败' }

      - name: 打包 Client MSI + 结构断言
        shell: pwsh
        run: |
          & .\scripts/build-msi.ps1 -Version 0.0.1 -WixPath (Join-Path $HOME '.dotnet/tools/wix.exe')
          if (-not $?) { throw 'Client MSI 打包失败' }
          & .\scripts/verify-msi-ui.ps1 -MsiPaths @('artifacts\LabelFrame-Client-0.0.1.msi')

  # Android 构建迭代 49 起为第三项必需检查（先合入本 job、验证全绿后补进门禁 ruleset）；
  # AndroidHost 不在 LabelFrame.slnx，本 job 单独构建该工程（决策 #104）。
  android:
    name: Android 构建（PDA 宿主）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件（platforms;android-36 / build-tools 36.0.0）
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 安装 .NET Android workload
        run: dotnet workload install android

      # Release + EmbedAssembliesIntoApk：程序集打包进 APK，产物可脱离开发环境独立安装（决策 #95⑦）
      - name: 构建 Release APK
        run: >
          dotnet build src/LabelFrame.AndroidHost/LabelFrame.AndroidHost.csproj
          -c Release -p:EmbedAssembliesIntoApk=true -p:AndroidSdkDirectory=$ANDROID_HOME

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/LabelFrame.AndroidHost/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
