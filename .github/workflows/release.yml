# LabelFrame 自动发布流水线（迭代 21；迭代 49 增加 Android APK；迭代 58 增加安装清单；迭代 63 增加 Zebra 官方插件包 .lfplugin——随 Release 附件发布、随 Client MSI 附带并收录 install manifest，决策 #123；迭代 67 修复步骤序——插件包构建先于 Client MSI 打包并加 fail-closed 断言，#97；迭代 68 增加引导 Bundle EXE——bundle job 分阶段生成 manifest 构建、随 Release 附件发布，决策 #132；迭代 71 起 Linux 归档默认 self-contained + compose 分发附件 compose.yml / .env 随 Release 发布，决策 #134；迭代 94 修复前端产物自检特征——迭代 75 下线「PDA 日志」页致旧特征消失、反标记空转，决策 #150；迭代 101 增加 Linux 离线部署包——offline-bundle job 组包 + 真离线自验后随 Release 附件发布，修订决策 #64「Release 不含 docker 离线包」口径，决策 #160）
# 触发：推送 v* tag（如 v0.17.0）；也可手动运行 workflow_dispatch 指定版本号。
# 流程：测试（dotnet + 前端双模式）→ 打包（双 MSI / 插件 zip / Zebra 官方插件包 / Linux 归档 / Android APK）→ 双镜像候选 E2E → 推送 ghcr.io → 引导 Bundle EXE（bundle job）+ Linux 离线部署包（offline-bundle job，含真离线自验）→ 生成安装清单 → 创建 GitHub Release。
# MSI 签名：仓库配置 MSI_SIGN_CERT_BASE64 / MSI_SIGN_PASSWORD Secret 时自动签名，否则跳过（自签证书过渡方案）。
# APK 签名：四个 ANDROID_KEYSTORE_* / ANDROID_KEY_* Secret 必须齐备，缺失即构建失败——不回退 debug 签名（签名稳定化，迭代 59 决策 #119）。
# 安装清单：install-manifest.json（+ latest.json 指针）由 release job 从当版真实产物生成并断言（schema 见 docs/DESIGN.md §6.2，迭代 58 决策 #115 / #120）；禁止人工维护。
# 引导 Bundle（迭代 68，决策 #132）：bundle job 先于 release job 分阶段生成同一口径的 manifest（消费其 runtime 条目构建引导 EXE），
#   release job 生成发布清单后做跨 job 一致性断言（runtime 哈希逐条比对，防厂商轮转窗口内两阶段错位）——不符即整次发版失败，重跑自愈。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 0.17.0）；tag 触发时自动从 tag 解析'
        required: false

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  PNPM_VERSION: '11.10.0'
  WIX_VERSION: '7.0.0'

jobs:
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then
            echo "::error::无法确定版本号（tag 触发请推 v*，手动触发请填 version）"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  test:
    name: 测试与前端构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet restore
        run: dotnet restore LabelFrame.slnx
      - name: dotnet build
        run: dotnet build LabelFrame.slnx -c Release --no-restore
      - name: dotnet test（日常口径；Perf / Soak 由 nightly-perf 跑）
        run: dotnet test LabelFrame.slnx -c Release --no-build --no-restore --filter "FullyQualifiedName!~Perf&FullyQualifiedName!~Soak"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 前端 lint
        working-directory: web
        run: pnpm lint
      - name: 前端测试（client 模式）
        working-directory: web
        run: pnpm test
      - name: 前端测试（server 模式）
        working-directory: web
        env:
          VITE_UI_MODE: server
        run: pnpm test
      - name: 前端构建（client）
        working-directory: web
        run: pnpm build
      - name: 前端构建（server）
        working-directory: web
        env:
          VITE_UI_MODE: server
        run: pnpm build:server
      - name: 前端产物自检（双模式区分，迭代 22 修复）
        working-directory: web
        shell: pwsh
        run: |
          # 防止 VITE_UI_MODE 未生效导致 dist-server 打成 client 模式
          # （迭代 94 修复特征串过时（PDA 日志/本机未注册）；v0.32.0 首跑再修：多语言迁移（迭代 107～114）后
          #  界面文案搬进 i18n 语言包随双构建整体打包——「本机打印服务」双产物命中、「客户端下载」双产物缺失，
          #  文案型特征全部失效。改用「构建期折叠的代码级特征」：client＝guide 域 key 前缀 `tour.workbench`
          #  （guide 语言包仅经 client-only 引用链进 client 产物，实证 2/0），server＝SERVER_TABS 专属 tab key
          #  `nav.devices`（client 折叠为 0、server 命中 1，实证 0/1；v0.32.0 发版取证双构建 grep））
          $clientJs = (Get-ChildItem 'dist/assets/*.js' | Select-Object -First 1).FullName
          $client = Get-Content $clientJs -Raw
          if ($client -notmatch 'tour.workbench') { throw 'dist 缺少 client 页面特征（tour.workbench），client 构建异常' }
          $serverJs = (Get-ChildItem 'dist-server/assets/*.js' | Select-Object -First 1).FullName
          $server = Get-Content $serverJs -Raw
          if ($server -match 'tour.workbench') { throw 'dist-server 为 client 模式产物：VITE_UI_MODE 未生效，请检查 build:server' }
          if ($server -notmatch 'nav.devices') { throw 'dist-server 缺少 server 页面特征（nav.devices），server 构建异常' }
          Write-Host "双模式产物自检通过：dist=client（$([IO.Path]::GetFileName($clientJs))）、dist-server=server（$([IO.Path]::GetFileName($serverJs))）"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-server
          path: web/dist-server
          if-no-files-found: error

  package:
    name: 打包安装包（MSI / 插件 / Linux 归档）
    needs: [version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 WiX Toolset
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: 安装 WiX 扩展（NetFx）
        shell: pwsh
        run: |
          $wix = Join-Path $HOME '.dotnet\tools\wix.exe'
          # WiX v7 任何命令前都需先接受 OSMF EULA
          & $wix eula accept wix7 2>$null | Out-Null
          & $wix extension add -g WixToolset.NetFx.wixext/${{ env.WIX_VERSION }}
          & $wix extension add -g WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          if ($LASTEXITCODE -ne 0) { throw 'wix extension add (UI) 失败' }
          if ($LASTEXITCODE -ne 0) { throw 'wix extension add 失败' }

      # 注意：upload-artifact 上传的是 dist 目录内容，下载路径要对应 web/dist 与 web/dist-server
      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: 下载服务端 UI 产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist-server
          path: web/dist-server

      - name: 准备签名证书（可选）
        shell: pwsh
        # env 映射缺失即静默跳过签名（#169 定位、#199 修复）：证书 Secret 必须显式映射进步骤
        env:
          MSI_SIGN_CERT_BASE64: ${{ secrets.MSI_SIGN_CERT_BASE64 }}
        run: |
          if ($env:MSI_SIGN_CERT_BASE64) {
            New-Item -ItemType Directory -Force -Path artifacts/cert | Out-Null
            [IO.File]::WriteAllBytes('artifacts/cert/labelframe.pfx', [Convert]::FromBase64String($env:MSI_SIGN_CERT_BASE64))
            Write-Host 'MSI 将使用配置的证书签名'
          } else {
            Write-Host '未配置 MSI_SIGN_CERT_BASE64，本次发布跳过 MSI 签名'
          }

      # 官方插件包（迭代 63，决策 #123）：必须先于 Client MSI 打包——MSI 附带该包（plugin-packages\，存量升级自动安装源）。
      # 步骤序为迭代 67（#97）修复：此前（PR #80 引入）误排在 Client MSI 之后，MSI 打包时检测不到 .lfplugin
      # 即静默跳过附带，公网发版 Client MSI 因此不含插件包（存量升级 zebra 自动安装不可能发生）。
      - name: 构建 Zebra 官方插件包（.lfplugin）
        shell: pwsh
        run: |
          & .\scripts\build-zebra-plugin.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Zebra 插件包构建失败' }

      # TSPL 官方插件（迭代 143，决策 #195）：与 zebra 同链构建——MSI 附带 + Release 附件 + Bundle 落位
      - name: 构建 TSPL 官方插件包（.lfplugin）
        shell: pwsh
        run: |
          & .\scripts\build-tspl-plugin.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'TSPL 插件包构建失败' }

      - name: 打包 Client MSI
        shell: pwsh
        env:
          MSI_SIGN_PASSWORD: ${{ secrets.MSI_SIGN_PASSWORD }}
        run: |
          # 哈希表 splat 按参数名绑定（#199）：数组 splat 按位置绑定，'-Sign' 等会被当作位置实参报错
          $sign = @{}
          if (Test-Path 'artifacts/cert/labelframe.pfx') {
            $sign = @{ Sign = $true; PfxPath = 'artifacts/cert/labelframe.pfx'; PfxPassword = $env:MSI_SIGN_PASSWORD }
          }
          & .\scripts\build-msi.ps1 -Version $env:VERSION -WixPath (Join-Path $HOME '.dotnet\tools\wix.exe') @sign
          if ($LASTEXITCODE -ne 0) { throw 'Client MSI 打包失败' }

      # 防回归断言（迭代 67，#97）：Client MSI 必含 plugin-packages\labelframe-transport-zebra-*.lfplugin
      # （决策 #123 存量升级自动安装源）。build-msi.ps1 缺包静默跳过是合法本地行为（本地裸构建与 CI
      # 「MSI 结构断言」必需检查依赖它），发版链 fail-closed 由本显式步骤承担——缺失即构建失败。
      - name: 断言 Client MSI 附带官方插件包（fail-closed）
        shell: pwsh
        run: |
          & .\scripts\assert-msi-plugin-package.ps1 -MsiPath "artifacts/LabelFrame-Client-$env:VERSION.msi"
          if (-not $?) { throw 'Client MSI 未附带官方插件包（plugin-packages\*.lfplugin 缺失）' }

      - name: 打包 Server MSI
        shell: pwsh
        env:
          MSI_SIGN_PASSWORD: ${{ secrets.MSI_SIGN_PASSWORD }}
        run: |
          # 哈希表 splat 按参数名绑定（#199）：数组 splat 按位置绑定，'-Sign' 等会被当作位置实参报错
          $sign = @{}
          if (Test-Path 'artifacts/cert/labelframe.pfx') {
            $sign = @{ Sign = $true; PfxPath = 'artifacts/cert/labelframe.pfx'; PfxPassword = $env:MSI_SIGN_PASSWORD }
          }
          & .\scripts\build-server-msi.ps1 -Version $env:VERSION -WixPath (Join-Path $HOME '.dotnet\tools\wix.exe') @sign
          if ($LASTEXITCODE -ne 0) { throw 'Server MSI 打包失败' }

      - name: 打包管理界面插件
        shell: pwsh
        run: |
          # 脚本内无原生命令，LASTEXITCODE 为空值，用 $? 判断
          & .\scripts\package-server-webui.ps1 -Version $env:VERSION
          if (-not $?) { throw '插件包打包失败' }

      # 迭代 71（#91，决策 #134）起归档默认 self-contained：目标机免装 .NET 10 ASP.NET Core Runtime
      # （对齐 Windows 侧引导链教训 #128/#129）；framework-dependent 归档可经 install.sh 安装（缺运行时
      # 明确报错给官方直链，不自动安装）。release.yml 调用零变化——默认值在脚本内翻转。
      - name: 发布 Server（linux-x64，self-contained）并归档
        shell: pwsh
        run: |
          & .\scripts\publish-server-linux.ps1 -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Linux 归档失败' }

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/LabelFrame-Server-*.msi
            artifacts/LabelFrame-Client-*.msi
            artifacts/labelframe-server-webui-*.zip
            artifacts/labelframe-server-*-linux-x64.tar.gz
            artifacts/labelframe-transport-zebra-*.lfplugin
            artifacts/labelframe-transport-tspl-*.lfplugin
          if-no-files-found: error

  android:
    name: 打包 Android APK（PDA 宿主）
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件（platforms;android-36 / build-tools 36.0.0）
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 安装 .NET Android workload
        run: dotnet workload install android

      - name: 计算数值版本号（versionCode，如 0.26.0 → 2600）
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "VERSION_CODE=$((MAJOR*10000 + MINOR*100 + ${PATCH:-0}))" >> "$GITHUB_ENV"

      # 签名稳定化（迭代 59 决策 #119）：Release 构建绝不回退 debug 签名——Secrets 缺失即失败。
      # 回退路径意味着两次构建可能签名不一致：用户无法覆盖升级，且换签名会重置 ANDROID_ID（设备号绑定签名），
      # 服务端设备目录错乱。证书管理与换签名影响见 docs/DEPLOY.md §8。
      - name: 校验并准备签名 keystore（Secrets 缺失即失败）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=0
          for VAR in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              echo "::error::缺少 Android 签名 Secret：$VAR（Release 构建不回退 debug 签名；请按 docs/DEPLOY.md §8 配置，keystore 生成后务必备份）"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            exit 1
          fi
          mkdir -p "$HOME/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/keystore/labelframe-release.keystore"
          echo "签名 Secrets 齐备，将使用配置的 keystore 签名 Release APK"

      - name: 构建 Release APK（版本号由 tag 注入，keystore 签名）
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet build src/LabelFrame.AndroidHost/LabelFrame.AndroidHost.csproj \
            -c Release -p:EmbedAssembliesIntoApk=true -p:AndroidSdkDirectory=$ANDROID_HOME \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$VERSION_CODE" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$HOME/keystore/labelframe-release.keystore" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"

      - name: 整理发布产物
        run: |
          mkdir -p artifacts
          cp src/LabelFrame.AndroidHost/bin/Release/net10.0-android/*-Signed.apk \
            "artifacts/LabelFrame-AndroidHost-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/LabelFrame-AndroidHost-*.apk
          if-no-files-found: error

  docker:
    name: Docker 双镜像（候选 E2E → ghcr.io）
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABELFRAME_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/labelframe-server
      LABELFRAME_CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/labelframe-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 发布 Server（linux-x64）
        run: |
          dotnet publish src/LabelFrame.Server/LabelFrame.Server.csproj \
            -c Release -f net10.0 -r linux-x64 -p:SelfContained=false \
            -o artifacts/server-linux/linux-x64 -p:DebugType=None -p:DebugSymbols=false
      - name: 写入默认配置
        run: cp packaging/appsettings-server.json artifacts/server-linux/linux-x64/appsettings.json

      - name: 下载服务端管理界面
        uses: actions/download-artifact@v4
        with:
          name: web-dist-server
          path: artifacts/server-linux/linux-x64/web-ui

      - name: 构建 Server / Linux Client 候选镜像
        run: |
          docker build \
            --build-arg LABELFRAME_VERSION="$VERSION" \
            -f packaging/ubuntu/Dockerfile \
            -t "$LABELFRAME_SERVER_IMAGE:$VERSION" \
            artifacts/server-linux/linux-x64
          docker build \
            --build-arg LABELFRAME_VERSION="$VERSION" \
            -f packaging/linux-client/Dockerfile \
            -t "$LABELFRAME_CLIENT_IMAGE:$VERSION" \
            .

      - name: 发布候选 Compose E2E
        shell: pwsh
        run: |
          ./scripts/test-linux-client-e2e.ps1 `
            -ComposeFile packaging/e2e/compose.release.yaml `
            -ServerPort 53910 `
            -DeviceId "linux-release-$env:VERSION" `
            -SkipBuild

      - name: 清理候选 E2E 环境
        if: always()
        run: docker compose -f packaging/e2e/compose.release.yaml down --volumes

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送已验收的 Server / Linux Client 镜像
        run: |
          docker tag "$LABELFRAME_SERVER_IMAGE:$VERSION" "$LABELFRAME_SERVER_IMAGE:latest"
          docker tag "$LABELFRAME_CLIENT_IMAGE:$VERSION" "$LABELFRAME_CLIENT_IMAGE:latest"
          docker push "$LABELFRAME_SERVER_IMAGE:$VERSION"
          docker push "$LABELFRAME_SERVER_IMAGE:latest"
          docker push "$LABELFRAME_CLIENT_IMAGE:$VERSION"
          docker push "$LABELFRAME_CLIENT_IMAGE:latest"

      # 离线包原料（迭代 101，#213，决策 #160）：save 已通过候选 E2E 并推送的 server 镜像——ghcr 全名 tag
      # 原样保留（offline-bundle job 消费侧 docker load 后本地命中 tag，compose 默认 pull=missing 不再联网拉取，
      # 离线包内 compose.yml 因此可与在线分发附件逐字节同源）。save 只取版本 tag（latest 属在线跟随语义）。
      - name: 导出 Server 镜像 tar（离线包原料）
        run: |
          mkdir -p artifacts/offline-image
          docker save "$LABELFRAME_SERVER_IMAGE:$VERSION" | gzip > "artifacts/offline-image/labelframe-server-$VERSION.image.tar.gz"
          test -s "artifacts/offline-image/labelframe-server-$VERSION.image.tar.gz"
          echo "镜像 tar 就位：$(du -h "artifacts/offline-image/labelframe-server-$VERSION.image.tar.gz" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: offline-image-tar
          path: artifacts/offline-image/labelframe-server-*.image.tar.gz
          if-no-files-found: error

  # 引导 Bundle（迭代 68，#101，决策 #132）：Windows job 构建引导 EXE 并随 Release 附件发布。
  # 步骤序（#97 教训——先声明依赖再排步骤）：bundle 构建需五类产物在场（双 MSI / webui zip / .lfplugin 来自
  # release-assets，APK 来自 android-apk——manifest 收录 pda-apk 条目，缺产物即生成失败），故 needs [package, android]；
  # manifest 分阶段生成——本 job 先按与 release job 完全相同的参数生成一份当版 manifest（bundle 消费用的
  # runtime 直链 + 哈希来源于此），release job 再生成发布清单并做跨 job 一致性断言（runtime 哈希逐条比对）。
  # runtime 下载目录共享（artifacts/runtimes）：generate 下载实测哈希落 manifest，build-bundle 缓存命中直接消费，同 job 内只下载一次。
  bundle:
    name: 构建安装引导 EXE（Burn Bundle）
    needs: [version, package, android]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      runtimeDesktopSha256: ${{ steps.bundle-meta.outputs.runtimeDesktopSha256 }}
      runtimeAspNetCoreSha256: ${{ steps.bundle-meta.outputs.runtimeAspNetCoreSha256 }}
      runtimeWebView2Sha256: ${{ steps.bundle-meta.outputs.runtimeWebView2Sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 安装 WiX Toolset
        run: dotnet tool install --global wix --version ${{ env.WIX_VERSION }}

      - name: 接受 WiX OSMF EULA
        shell: pwsh
        run: |
          $wix = Join-Path $HOME '.dotnet\tools\wix.exe'
          & $wix eula accept wix7 2>$null | Out-Null

      - name: 下载发布产物
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      # 分阶段生成（bundle 消费侧）：参数与 release job 的生成步骤完全一致（同产物、同脚本、同默认 runtime 版本），
      # 一致性由 release job 的跨 job 断言 fail-closed 兜底。
      - name: 生成安装清单（bundle 消费侧）
        shell: pwsh
        run: |
          ./scripts/generate-install-manifest.ps1 `
            -Version $env:VERSION `
            -AssetsDir release `
            -OwnerRepo '${{ github.repository }}' `
            -RuntimeDownloadDir artifacts/runtimes

      - name: 准备签名证书（可选）
        shell: pwsh
        run: |
          if ($env:MSI_SIGN_CERT_BASE64) {
            New-Item -ItemType Directory -Force -Path artifacts/cert | Out-Null
            [IO.File]::WriteAllBytes('artifacts/cert/labelframe.pfx', [Convert]::FromBase64String($env:MSI_SIGN_CERT_BASE64))
            Write-Host '引导 EXE 将使用配置的证书签名（与 MSI 同通道）'
          } else {
            Write-Host '未配置 MSI_SIGN_CERT_BASE64，本次跳过引导 EXE 签名'
          }
        env:
          MSI_SIGN_CERT_BASE64: ${{ secrets.MSI_SIGN_CERT_BASE64 }}

      - name: 构建引导 Bundle（LabelFrame-Bootstrapper-<版本>.exe）
        shell: pwsh
        env:
          MSI_SIGN_PASSWORD: ${{ secrets.MSI_SIGN_PASSWORD }}
        run: |
          # 哈希表 splat 按参数名绑定（#199）：数组 splat 按位置绑定，'-Sign' 等会被当作位置实参报错（v0.29.0 首跑即炸于此）
          $sign = @{}
          if (Test-Path 'artifacts/cert/labelframe.pfx') {
            $sign = @{ Sign = $true; PfxPath = 'artifacts/cert/labelframe.pfx'; PfxPassword = $env:MSI_SIGN_PASSWORD }
          }
          & .\scripts\build-bundle.ps1 `
            -Version $env:VERSION `
            -WixPath (Join-Path $HOME '.dotnet\tools\wix.exe') `
            -MsiDir release `
            -DownloadBase "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION" `
            -ManifestSource release/install-manifest.json `
            -RuntimeCacheDir artifacts/runtimes @sign
          if ($LASTEXITCODE -ne 0) { throw '引导 Bundle 构建失败' }

      # fail-closed：产物缺失 / 未生成即失败，不允许无 EXE 的「成功」发版（同 #97 断言口径）
      - name: 断言引导 EXE 在场（fail-closed）
        shell: pwsh
        run: |
          $exe = "artifacts/LabelFrame-Bootstrapper-$env:VERSION.exe"
          if (-not (Test-Path $exe)) { throw "引导 EXE 不存在：$exe" }
          Write-Host "引导 EXE 在场：$exe（$([Math]::Round((Get-Item $exe).Length / 1MB, 2)) MB）"

      - name: 提取 bundle 消费侧 runtime 哈希（供 release job 一致性断言）
        id: bundle-meta
        shell: pwsh
        run: |
          $m = Get-Content release/install-manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $desktop = @($m.components | Where-Object id -eq 'runtime-desktop')[0]
          $aspnet = @($m.components | Where-Object id -eq 'runtime-aspnetcore')[0]
          $webview2 = @($m.components | Where-Object id -eq 'runtime-webview2')[0]
          if (-not $desktop -or -not $aspnet -or -not $webview2) { throw 'bundle 消费侧 manifest 缺 runtime 条目' }
          "runtimeDesktopSha256=$($desktop.sha256)" >> $env:GITHUB_OUTPUT
          "runtimeAspNetCoreSha256=$($aspnet.sha256)" >> $env:GITHUB_OUTPUT
          "runtimeWebView2Sha256=$($webview2.sha256)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-exe
          path: artifacts/LabelFrame-Bootstrapper-*.exe
          if-no-files-found: error

  # Linux 离线部署包（迭代 101，#213，决策 #160——修订 #64「Release 不含 docker 离线包」）：
  # 消费 docker job 已验收镜像 tar + package / android job 分发产物 + 管理界面 zip，组装单附件
  # labelframe-offline-<版本>-linux-x64.tar.gz（镜像 tar + 同源 compose.yml + 钉定 .env + README / install.sh +
  # packages 三件 + 预解压管理界面 + SHA256SUMS；组包契约见 scripts/make-offline-bundle.sh 头注）。
  # 真离线自验：本 job 与 docker job 不同 runner、无本地镜像——解压最终 tar.gz 后以包内 install.sh 走用户
  # 路径（校验 → load → compose up → /healthz 就绪），离线包不可用即整次发版失败（fail-closed，#97 口径）。
  # 整包不进 install-manifest（与 compose 分发附件同口径：自足分发单元而非可安装产物，#116 / #134）。
  offline-bundle:
    name: 组装 Linux 离线部署包（真离线自验）
    needs: [version, docker, package, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载发布产物（MSI / 插件包 / 管理界面 zip）
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: 下载镜像 tar
        uses: actions/download-artifact@v4
        with:
          name: offline-image-tar
          path: image

      - name: 组装离线包
        run: |
          bash scripts/make-offline-bundle.sh \
            -v "$VERSION" \
            --image-tar "image/labelframe-server-$VERSION.image.tar.gz" \
            --client-package "release/LabelFrame-Client-$VERSION.msi" \
            --pda-package "release/LabelFrame-AndroidHost-$VERSION.apk" \
            --plugin-package "release/labelframe-transport-zebra-$VERSION.lfplugin" \
            --plugin-package "release/labelframe-transport-tspl-$VERSION.lfplugin" \
            --webui-zip "release/labelframe-server-webui-$VERSION.zip" \
            -o bundle

      # fail-closed 结构断言（对最终 tar.gz 再验一次，防「组包成功但归档错位」；脚本内已有布局断言）
      - name: 断言离线包结构（fail-closed）
        run: |
          TARBALL="bundle/labelframe-offline-$VERSION-linux-x64.tar.gz"
          test -s "$TARBALL"
          mkdir -p verify && tar -xzf "$TARBALL" -C verify
          cd "verify/labelframe-offline-$VERSION-linux-x64"
          test -s README.md && test -s install.sh && test -s compose.yml && test -s .env && test -s SHA256SUMS
          test -s "images/labelframe-server-$VERSION.image.tar.gz"
          test -s plugins/web-ui/index.html
          ls packages/client/LabelFrame-Client-$VERSION.msi >/dev/null
          ls packages/pda/LabelFrame-AndroidHost-$VERSION.apk >/dev/null
          ls packages/plugin/labelframe-transport-zebra-$VERSION.lfplugin >/dev/null
          ls packages/plugin/labelframe-transport-tspl-$VERSION.lfplugin >/dev/null
          grep -q "^LABELFRAME_VERSION=$VERSION$" .env
          echo "离线包结构断言通过：$TARBALL（$(du -h "../../$TARBALL" | cut -f1)）"

      # 真离线自验：解压 tar.gz 后以包内 install.sh 走用户路径全链（本 runner 无该镜像，load 前本地必不存在）
      - name: 真离线自验（包内 install.sh 全链）
        run: |
          docker image inspect "ghcr.io/${{ github.repository_owner }}/labelframe-server:$VERSION" >/dev/null 2>&1 \
            && { echo '::error::本 runner 意外已有目标镜像，自验前提不成立'; exit 1; } || true
          cd "verify/labelframe-offline-$VERSION-linux-x64"
          bash install.sh

      - name: 清理自验环境
        if: always()
        run: |
          if [ -d "verify/labelframe-offline-$VERSION-linux-x64" ]; then
            (cd "verify/labelframe-offline-$VERSION-linux-x64" && docker compose down --volumes) || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: bundle/labelframe-offline-*.tar.gz
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: [version, package, docker, android, bundle, offline-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载发布附件
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: 下载引导 EXE
        uses: actions/download-artifact@v4
        with:
          name: bundle-exe
          path: release

      - name: 下载 Linux 离线部署包
        uses: actions/download-artifact@v4
        with:
          name: offline-bundle
          path: release

      # 安装清单（迭代 58，#51）：从当版全部产物生成 install-manifest.json + latest.json（决策 #115 / #120）。
      # 生成阶段即校验产物齐备：任一组件缺产物立即失败（AC-03 场景之一），空哈希 / 空条目不可能落盘。
      - name: 生成安装清单（install-manifest.json + latest.json）
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/generate-install-manifest.ps1 `
            -Version $env:VERSION `
            -AssetsDir release `
            -OwnerRepo '${{ github.repository }}'

      # 断言独立于生成重读落盘清单（AC-03）：schema 字段完整性 + 产物存在性 + 哈希抽验（逐条目重算比对）；
      # 缺产物 / 缺哈希 / schema 不符任一命中即非零退出，本 job 失败、不创建 Release。
      - name: 断言安装清单（schema 完整性 / 产物存在性 / 哈希抽验）
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/generate-install-manifest.ps1 `
            -Version $env:VERSION `
            -AssetsDir release `
            -OwnerRepo '${{ github.repository }}' `
            -VerifyOnly

      # 跨 job 一致性断言（迭代 68，决策 #132）：bundle job 分阶段生成的 manifest（引导 EXE 构建消费）
      # 与本 job 生成的发布清单必须 runtime 哈希一致——两次生成各自从厂商直链实测，若厂商在窗口内轮转文件
      # 则两份不一致，此处 fail-closed 拦截（发布清单与引导 EXE 内嵌摘要错位 = 用户侧校验失败），重跑流水线自愈。
      - name: 断言发布清单与引导 Bundle 消费侧一致（runtime 哈希，fail-closed）
        shell: pwsh
        env:
          BUNDLE_DESKTOP_SHA256: ${{ needs.bundle.outputs.runtimeDesktopSha256 }}
          BUNDLE_ASPNETCORE_SHA256: ${{ needs.bundle.outputs.runtimeAspNetCoreSha256 }}
          BUNDLE_WEBVIEW2_SHA256: ${{ needs.bundle.outputs.runtimeWebView2Sha256 }}
        run: |
          $m = Get-Content release/install-manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $pairs = @(
            @{ id = 'runtime-desktop';     expected = $env:BUNDLE_DESKTOP_SHA256 },
            @{ id = 'runtime-aspnetcore';  expected = $env:BUNDLE_ASPNETCORE_SHA256 },
            @{ id = 'runtime-webview2';    expected = $env:BUNDLE_WEBVIEW2_SHA256 }
          )
          $fail = $false
          foreach ($p in $pairs) {
            $actual = @($m.components | Where-Object id -eq $p.id)[0].sha256
            if ($actual -ne $p.expected) {
              Write-Host "::error::runtime 哈希两阶段不一致：[$($p.id)] 发布清单=$actual bundle 消费侧=$($p.expected) —— 厂商可能在两次生成之间轮转了直链文件，请重跑本次发版"
              $fail = $true
            } else {
              Write-Host "runtime 哈希两阶段一致：[$($p.id)] $actual"
            }
          }
          if ($fail) { exit 1 }

      # compose 分发附件（迭代 71，#91，决策 #134）：compose.yml 与 packaging/ubuntu/docker-compose.yml
      # 同源复制（防漂移，含管理界面 / client-packages / pda-packages / plugin-packages 四组挂载注释）；
      # .env 由当版版本号生成（LABELFRAME_VERSION 钉定，LABELFRAME_IMAGE 覆盖注释模板）。
      # 两者不进 install manifest——部署描述文件而非可安装产物（#116 server-docker「无下载组件」口径维持）。
      - name: 生成 compose 分发附件（compose.yml + .env）
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp packaging/ubuntu/docker-compose.yml release/compose.yml
          cat > release/.env <<EOF
          # LabelFrame 服务端 compose 环境变量（发版自动生成，LABELFRAME_VERSION 已钉定为本 Release 版本）
          # 用法：与 compose.yml 放同一目录后 docker compose up -d；想跟随最新版可把版本改回 latest
          LABELFRAME_VERSION=$VERSION
          #LABELFRAME_IMAGE=ghcr.io/marci-labs/labelframe-server
          EOF
          test -s release/compose.yml
          test -s release/.env
          grep -q 'labelframe-server' release/compose.yml
          grep -q "LABELFRAME_VERSION=$VERSION" release/.env
          echo "compose 分发附件就绪：compose.yml + .env（版本钉定 $VERSION）"

      - name: 创建 Release（v${{ needs.version.outputs.version }}）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: LabelFrame v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/LabelFrame-Bootstrapper-*.exe
            release/LabelFrame-Server-*.msi
            release/LabelFrame-Client-*.msi
            release/LabelFrame-AndroidHost-*.apk
            release/labelframe-server-webui-*.zip
            release/labelframe-server-*-linux-x64.tar.gz
            release/labelframe-offline-*-linux-x64.tar.gz
            release/labelframe-transport-zebra-*.lfplugin
            release/labelframe-transport-tspl-*.lfplugin
            release/compose.yml
            release/.env
            release/install-manifest.json
            release/latest.json
